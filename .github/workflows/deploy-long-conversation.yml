name: Deploy Long Conversation

on:
  push:
    branches: [chore/phase0-folder-reshape]
    paths:
      - 'phase0/lc/**'
      - '.github/workflows/deploy-long-conversation.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Debug cwd
        run: pwd && ls -la
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_TxpFRSEtBkNEcfFiWH7qBAa9q7oj
        run: vercel deploy --prod --yes --token $VERCEL_TOKEN
